name: p

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      K: ${{ secrets.K }}
    steps:
      - uses: actions/checkout@v5
      - run: node --version && node p.mjs
      - if: ${{ !cancelled() }}
        run: node s.mjs
      - if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: ${{ !cancelled() }}
        run: node b.mjs
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: p
          path: o/*.enc
          if-no-files-found: ignore
          retention-days: 7
